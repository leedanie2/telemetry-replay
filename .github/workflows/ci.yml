name: Telemetry checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application image
        run: docker compose build app
      - name: Unit tests without a database
        run: docker compose run --rm --no-deps --entrypoint python app -m unittest discover -s tests -v
      - name: Start PostgreSQL
        run: docker compose up -d --wait --wait-timeout 90 postgres
      - name: Database integration tests
        run: docker compose run --rm -e TELEMETRY_INTEGRATION=1 --entrypoint python app -m unittest discover -s tests -v
      - name: Reproducible isolated demo
        run: docker compose run --rm app demo
      - name: Persistent schema and CLI smoke check
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm app init-db
          docker compose run --rm app register-device A "Synthetic demo device"
          docker compose run --rm app replay fixtures/readings.csv
          docker compose run --rm app replay fixtures/readings.csv
          docker compose run --rm app report > all.json
          docker compose run --rm app report --device A > selected.json
          docker compose run --rm app report --device unknown > unknown.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('all.json').read_text())
          selected = json.loads(Path('selected.json').read_text())
          assert len(rows) == 6 and all(row['device_id'] == 'A' for row in rows)
          assert selected == rows
          assert json.loads(Path('unknown.json').read_text()) == []
          PY
          if docker compose run --rm app init-db; then
            echo "Expected a second initialization to fail, protecting existing tables."
            exit 1
          fi
          docker compose restart postgres
          docker compose up -d --wait --wait-timeout 90 postgres
          docker compose run --rm app report > after-restart.json
          cmp all.json after-restart.json
      - name: PostgreSQL logs on failure
        if: failure()
        run: docker compose logs --no-color postgres
      - name: Remove CI containers and disposable database
        if: always()
        run: docker compose down --volumes --remove-orphans
