services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      # Disposable local/CI credentials, never deployment credentials.
      POSTGRES_PASSWORD: telemetry-local-only
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U telemetry -d telemetry"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    # No host ports: only containers on this Compose network reach PostgreSQL.

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://telemetry:telemetry-local-only@postgres:5432/telemetry
    depends_on:
      postgres:
        condition: service_healthy
    command: ["demo"]

volumes:
  postgres_data:
